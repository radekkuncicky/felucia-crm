# Catch-all pro neznámý Host / přístup přes IP (SEC-14, docs/SECURITY_AUDIT_2026-09.md).
# Bez něj byl default pro :443 první server blok (crm.workspace-nanto.cz s expirovaným
# certem) a neznámé Hosty se proxovaly do aplikace. 444 = spojení se zavře bez odpovědi.
# Instalace: scripts/install-nginx-catchall.sh
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # TLS handshake potřebuje nějaký cert — wildcard felucia.io (platný, auto-renew)
    ssl_certificate /etc/letsencrypt/live/felucia.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/felucia.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 444;
}
