# Maskování capability tokenů v access logu (SEC-49): odkazy na podpis smlouvy,
# nabídky, reset hesla, magic link, ICS a podepsané /uploads nesou token v URL —
# v logu (skupina adm, 14 dní) by fungovaly jako heslo.
# Instalace: scripts/install-nginx-logmask.sh (vloží do conf.d + přepne access_log)
map $request_uri $request_uri_masked {
    default                                  $request_uri;
    "~^(?<p>/podpis/)[^/?]+(?<r>.*)$"        "${p}***${r}";
    "~^(?<p>/nabidka/)[^/?]+(?<r>.*)$"       "${p}***${r}";
    "~^(?<p>/cenovka/)[^/?]+(?<r>.*)$"       "${p}***${r}";
    "~^(?<p>/zarizeni/)[^/?]+(?<r>.*)$"      "${p}***${r}";
    "~^(?<p>/api/public/podpis/)[^/?]+(?<r>.*)$" "${p}***${r}";
    "~^(?<p>[^?]*\?.*(token|sig|exp)=)"      "${p}***";
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $request_uri_masked $server_protocol" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
